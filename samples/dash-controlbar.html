<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./dash-control.css" />
    <link href="https://vjs.zencdn.net/7.17.0/video-js.css" rel="stylesheet" />
    <!-- <script src="https://vjs.zencdn.net/7.17.0/video.min.js"></script> -->
    <title>Dash js Video Player with quality selection</title>

    <!-- newrelic browser agent. REMEMBER TO REPLACE THIS SCRIPT WITH YOUR OWN BROWSER AGENT -->
    <script src="agent.js"></script>

    <!-- Dash Js Official CDN -->
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <script src="https://vjs.zencdn.net/7.17.0/video.min.js"></script>

    <!-- New Relic Video Dash Tracker  -->
    <script src="../dist/newrelic-video-dash.min.js"></script>
    <script src="../dist/newrelic-video-videojs.min.js"></script>
  </head>
  <body>
    <div class="main">
      <h1 class="title">Welcome to Dash Js Video Player</h1>
      <div id="videoContainer">
        <div id="loader"></div>

        <div id="video-container">
          <video
            id="myPlayer"
            crossorigin="anonymous"
            controls
            class="myPlayer"
          ></video>
          <div>
            <label for="qualityLevels" class="options">
              <select id="qualityLevels" class="qualityLevels"></select>
            </label>
          </div>
        </div>

        <div class="videojs-player">
          <video
            id="my-video"
            class="video-js"
            controls
            preload="auto"
            width="640"
            height="264"
          >
            <source
              src="https://d2zihajmogu5jn.cloudfront.net/bipbop-advanced/bipbop_16x9_variant.m3u8"
            />
          </video>
        </div>
      </div>
    </div>

    <script>
      var player2 = videojs('my-video');
      console.log('player', player2);
      nrvideo.Core.addTracker(new nrvideo.VideojsTracker(player2));
    </script>
    <script src="./dash-control.js"></script>
  </body>
</html>
