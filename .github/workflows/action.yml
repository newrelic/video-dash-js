name: PR Validation Workflow
on:
  pull_request:
    branches:
      - main
jobs:
  run-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        id: run_tests
        run: npm test -- --coverage
      - name: Check coverage
        run: |
          coverage=$(npm test -- --coverage | grep -oP 'All files.*\K\d+(?=%)')
          if [ $coverage -lt 90 ]; then
            echo "Coverage is less than 90%"
            exit 1
          fi
